<!-- Custom events -->
<script>
  (function () {
    function ph() { return window.posthog; }

    document.addEventListener('DOMContentLoaded', function () {
      // Event 1: clicks on any portfolio link (Software Factory, Agent-Friendly Docs, etc.)
      document.querySelectorAll('.portfolio-card a[href]').forEach(function (link) {
        link.addEventListener('click', function () {
          var card = link.closest('.portfolio-card');
          var company = card ? (card.querySelector('.card-company') || {}).textContent : null;
          var tag = card ? (card.querySelector('.card-tag') || {}).textContent : null;
          if (ph()) ph().capture('portfolio_link_click', {
            link_text: (link.textContent || '').trim(),
            link_url: link.getAttribute('href'),
            company: company ? company.trim() : null,
            tag: tag ? tag.trim() : null
          });
        });
      });

      // Event 2: click through to GitHub or LinkedIn from anywhere (footer, posts, etc.)
      document.querySelectorAll('a[href]').forEach(function (link) {
        var href = link.getAttribute('href') || '';
        var destination = null;
        if (/github\.com/i.test(href)) destination = 'github';
        else if (/linkedin\.com/i.test(href)) destination = 'linkedin';
        if (!destination) return;
        link.addEventListener('click', function () {
          if (ph()) ph().capture('outbound_click', {
            destination: destination,
            link_url: href,
            link_text: (link.textContent || '').trim(),
            source_path: window.location.pathname
          });
        });
      });

      // Event 3: time-on-page for the Software Factory post specifically
      var softwareFactoryPath = '/2026/06/29/documentation-software-factory-warp.html';
      if (window.location.pathname === softwareFactoryPath) {
        var start = Date.now();
        var sent = false;
        function sendTimeOnPage() {
          if (sent) return;
          sent = true;
          var seconds = Math.round((Date.now() - start) / 1000);
          if (ph()) ph().capture('software_factory_time_on_page', {
            seconds_on_page: seconds,
            path: softwareFactoryPath
          });
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') sendTimeOnPage();
        });
        window.addEventListener('pagehide', sendTimeOnPage);
      }
    });
  })();
</script>
